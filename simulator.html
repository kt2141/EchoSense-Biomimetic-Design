<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EchoSense Biomimetic Simulator</title>
  <style>
    :root {
      --bg: #091018;
      --panel: #0f1b28;
      --amber: #ffbf40;
      --teal: #37d6c2;
      --text: #e6f1ff;
      --muted: #9eb4c8;
      --danger: #ff5e5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 25% 15%, #142233 0, #091018 50%),
        repeating-linear-gradient(60deg, rgba(55,214,194,0.06) 0 2px, transparent 2px 38px),
        repeating-linear-gradient(-60deg, rgba(255,191,64,0.06) 0 2px, transparent 2px 38px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .app {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
    }
    .panel {
      background: rgba(15, 27, 40, 0.88);
      border: 1px solid rgba(55, 214, 194, 0.3);
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: var(--amber);
      letter-spacing: 0.03em;
    }
    canvas { width: 100%; display: block; }
    #sceneCanvas { height: 520px; }
    #scopeCanvas { height: 200px; border-top: 1px solid rgba(255,255,255,0.08); }
    .readouts {
      padding: 0.8rem 1rem 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      font-size: 0.95rem;
    }
    .readouts .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 0.55rem 0.6rem;
    }
    .label { color: var(--muted); display: block; font-size: 0.78rem; text-transform: uppercase; }
    .value { color: var(--teal); font-weight: 700; }
    .controls { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.75rem;
      color: #101820;
      background: linear-gradient(90deg, var(--amber), var(--teal));
      font-weight: 700;
      cursor: pointer;
    }
    .hint { color: var(--muted); font-size: 0.82rem; margin-top: 0.65rem; line-height: 1.4; }
    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      #sceneCanvas { height: 420px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h2>Urban Footpath Echolocation Field (0–400 cm, 15° cone)</h2>
      <canvas id="sceneCanvas" width="760" height="520"></canvas>
      <canvas id="scopeCanvas" width="760" height="200"></canvas>
    </section>

    <aside class="panel">
      <h2>Real-time Physics & Tactile Mapping</h2>
      <div class="readouts" id="readouts"></div>
      <div class="controls">
        <button id="hapticBtn">Simulate Haptic/Audio Pulse: OFF</button>
        <p class="hint">
          Drag the pedestrian (teal) or obstacles (amber). Simulation emits virtual 40 kHz pulses,
          computes Time-of-Flight, maps distance to tactile zones, and displays ERM PWM waveform.
        </p>
      </div>
    </aside>
  </main>

  <script>
    const scene = document.getElementById('sceneCanvas');
    const scope = document.getElementById('scopeCanvas');
    const sx = scene.getContext('2d');
    const wx = scope.getContext('2d');
    const readouts = document.getElementById('readouts');
    const hapticBtn = document.getElementById('hapticBtn');

    const CM_TO_PX = 1.25;
    const MAX_CM = 400;
    const BEAM_HALF_RAD = (15 * Math.PI / 180) / 2;
    const SPEED_SOUND = 343;

    const pedestrian = { x: 120, y: scene.height / 2, r: 13, type: 'pedestrian' };
    const obstacles = [
      { x: 380, y: 180, r: 18, label: 'Pole' },
      { x: 520, y: 265, r: 22, label: 'Crowd' },
      { x: 340, y: 360, r: 16, label: 'Kerb' },
      { x: 620, y: 150, r: 20, label: 'Branch' }
    ];

    let dragTarget = null;
    let dragOffset = { x: 0, y: 0 };
    let hapticEnabled = false;
    let audioCtx = null;
    let osc = null;
    let gain = null;
    let hapticTimer = null;
    let simState = {
      distanceCm: MAX_CM,
      tofMs: (2 * (MAX_CM / 100)) / SPEED_SOUND * 1000,
      zone: 'CLEAR',
      duty: 0,
      hz: 0,
      output: 0,
      now: performance.now()
    };

    function zoneFromDistance(cm) {
      if (cm > 200) return { zone: 'CLEAR', duty: 0, hz: 0 };
      if (cm >= 100) {
        const duty = 35 + ((200 - cm) / 100) * 15;
        return { zone: 'AWARE', duty, hz: 1 };
      }
      if (cm >= 50) {
        const duty = 65 + ((100 - cm) / 50) * 15;
        return { zone: 'NEAR', duty, hz: 3 };
      }
      return { zone: 'DANGER', duty: 100, hz: 0 };
    }

    function nearestObstacleInCone() {
      let nearest = null;
      for (const o of obstacles) {
        const dx = o.x - pedestrian.x;
        const dy = o.y - pedestrian.y;
        const centerDistPx = Math.hypot(dx, dy);
        const edgeDistPx = Math.max(0, centerDistPx - o.r);
        const cm = edgeDistPx / CM_TO_PX;
        if (cm > MAX_CM) continue;
        const ang = Math.atan2(dy, dx);
        if (Math.abs(ang) > BEAM_HALF_RAD || dx <= 0) continue;
        if (!nearest || cm < nearest.cm) nearest = { o, cm, dx, dy };
      }
      return nearest;
    }

    function pulseEnvelope(tSec, hz) {
      if (hz <= 0) return 1;
      const period = 1 / hz;
      const phase = tSec % period;
      return phase < period * 0.5 ? 1 : 0;
    }

    function updateSim() {
      const n = nearestObstacleInCone();
      const cm = n ? n.cm : MAX_CM;
      const tofMs = (2 * (cm / 100)) / SPEED_SOUND * 1000;
      const z = zoneFromDistance(cm);
      const tSec = performance.now() / 1000;
      const env = z.zone === 'DANGER' ? 1 : pulseEnvelope(tSec, z.hz);
      simState = {
        distanceCm: cm,
        tofMs,
        zone: z.zone,
        duty: z.duty,
        hz: z.zone === 'DANGER' ? Infinity : z.hz,
        output: (z.duty / 100) * env,
        now: performance.now()
      };
    }

    function drawScene() {
      sx.clearRect(0, 0, scene.width, scene.height);
      sx.fillStyle = '#0a141f';
      sx.fillRect(0, 0, scene.width, scene.height);

      sx.strokeStyle = 'rgba(55,214,194,0.16)';
      for (let x = 0; x < scene.width; x += 42) {
        sx.beginPath(); sx.moveTo(x, 0); sx.lineTo(x, scene.height); sx.stroke();
      }

      sx.save();
      sx.translate(pedestrian.x, pedestrian.y);
      sx.beginPath();
      sx.moveTo(0, 0);
      sx.arc(0, 0, MAX_CM * CM_TO_PX, -BEAM_HALF_RAD, BEAM_HALF_RAD);
      sx.closePath();
      sx.fillStyle = 'rgba(55,214,194,0.12)';
      sx.fill();
      sx.strokeStyle = 'rgba(55,214,194,0.5)';
      sx.stroke();
      sx.restore();

      for (const o of obstacles) {
        sx.beginPath();
        sx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        sx.fillStyle = 'rgba(255,191,64,0.85)';
        sx.fill();
        sx.fillStyle = '#101820';
        sx.font = '11px sans-serif';
        sx.fillText(o.label, o.x - o.r, o.y - o.r - 6);
      }

      sx.beginPath();
      sx.arc(pedestrian.x, pedestrian.y, pedestrian.r, 0, Math.PI * 2);
      sx.fillStyle = '#37d6c2';
      sx.fill();
      sx.strokeStyle = '#ffffff';
      sx.stroke();

      const n = nearestObstacleInCone();
      if (n) {
        sx.beginPath();
        sx.moveTo(pedestrian.x, pedestrian.y);
        sx.lineTo(n.o.x, n.o.y);
        sx.strokeStyle = simState.zone === 'DANGER' ? '#ff5e5e' : '#ffbf40';
        sx.lineWidth = 2;
        sx.stroke();
        sx.lineWidth = 1;
      }
    }

    function drawWaveform() {
      const w = scope.width, h = scope.height;
      wx.fillStyle = '#0a141f';
      wx.fillRect(0, 0, w, h);
      wx.strokeStyle = 'rgba(255,255,255,0.15)';
      wx.beginPath();
      wx.moveTo(0, h - 22);
      wx.lineTo(w, h - 22);
      wx.stroke();

      const t0 = performance.now() / 1000;
      wx.strokeStyle = '#ffbf40';
      wx.beginPath();
      for (let x = 0; x < w; x++) {
        const t = t0 - (w - x) * 0.006;
        const env = simState.zone === 'DANGER' ? 1 : pulseEnvelope(t, Number.isFinite(simState.hz) ? simState.hz : 0);
        const amp = (simState.duty / 100) * env;
        const y = (h - 24) - amp * (h - 40);
        if (x === 0) wx.moveTo(x, y); else wx.lineTo(x, y);
      }
      wx.stroke();
      wx.fillStyle = '#9eb4c8';
      wx.font = '12px sans-serif';
      wx.fillText('PWM Pulse Train (all 3 ERM motors share duty envelope)', 12, 16);
    }

    function renderReadouts() {
      const tofUs = simState.tofMs * 1000;
      const hzText = Number.isFinite(simState.hz) ? `${simState.hz.toFixed(1)} Hz` : 'Continuous';
      const cards = [
        ['Ultrasonic ToF', `${tofUs.toFixed(0)} µs / ${simState.tofMs.toFixed(2)} ms`],
        ['Distance', `${simState.distanceCm.toFixed(1)} cm`],
        ['Tactile Zone', simState.zone],
        ['PWM Duty Cycle', `${simState.duty.toFixed(1)} %`],
        ['ERM Motor Pulse', hzText],
        ['PWM Value (8-bit)', `${Math.round(simState.duty * 2.55)} / 255`]
      ];
      readouts.innerHTML = cards.map(([k, v]) =>
        `<div class="card"><span class="label">${k}</span><span class="value">${v}</span></div>`
      ).join('');
    }

    function pointerPos(ev) {
      const r = scene.getBoundingClientRect();
      return {
        x: ((ev.clientX - r.left) / r.width) * scene.width,
        y: ((ev.clientY - r.top) / r.height) * scene.height
      };
    }

    function pickTarget(p) {
      const entities = [pedestrian, ...obstacles];
      return entities.find(e => Math.hypot(p.x - e.x, p.y - e.y) <= e.r + 6) || null;
    }

    function setHaptic(on) {
      hapticEnabled = on;
      hapticBtn.textContent = `Simulate Haptic/Audio Pulse: ${on ? 'ON' : 'OFF'}`;
      if (!on) {
        if (hapticTimer) clearInterval(hapticTimer);
        hapticTimer = null;
        if (gain && audioCtx) gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 120;
        gain.gain.value = 0;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      hapticTimer = setInterval(() => {
        const amp = simState.output;
        if (navigator.vibrate) {
          if (simState.zone === 'DANGER') navigator.vibrate(120);
          else if (simState.zone === 'NEAR') navigator.vibrate(amp > 0 ? 80 : 0);
          else if (simState.zone === 'AWARE') navigator.vibrate(amp > 0 ? 45 : 0);
          else navigator.vibrate(0);
        }
        if (gain && audioCtx) {
          const now = audioCtx.currentTime;
          const f = 120 + amp * 60;
          osc.frequency.setTargetAtTime(f, now, 0.03);
          gain.gain.setTargetAtTime(amp * 0.2, now, 0.04);
        }
      }, 100);
    }

    scene.addEventListener('pointerdown', ev => {
      const p = pointerPos(ev);
      const t = pickTarget(p);
      if (!t) return;
      dragTarget = t;
      dragOffset.x = p.x - t.x;
      dragOffset.y = p.y - t.y;
      scene.setPointerCapture(ev.pointerId);
    });
    scene.addEventListener('pointermove', ev => {
      if (!dragTarget) return;
      const p = pointerPos(ev);
      dragTarget.x = Math.min(scene.width - dragTarget.r, Math.max(dragTarget.r, p.x - dragOffset.x));
      dragTarget.y = Math.min(scene.height - dragTarget.r, Math.max(dragTarget.r, p.y - dragOffset.y));
    });
    scene.addEventListener('pointerup', () => { dragTarget = null; });
    scene.addEventListener('pointercancel', () => { dragTarget = null; });

    hapticBtn.addEventListener('click', () => setHaptic(!hapticEnabled));

    function frame() {
      updateSim();
      drawScene();
      drawWaveform();
      renderReadouts();
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
